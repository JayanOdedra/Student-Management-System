<!-- delete_confirm.html - Fallback delete confirmation page (used for direct URL access) -->
{% extends 'students/base.html' %}

{% block title %}Delete Student - SMS{% endblock %}

{% block content %}

<div class="page-header text-center">
    <div class="container">
        <h2><i class="bi bi-trash-fill me-2"></i>Delete Student</h2>
        <p>This action is permanent and cannot be undone.</p>
    </div>
</div>

<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-danger shadow">
                <div class="card-body text-center p-5">
                    <i class="bi bi-person-x-fill text-danger" style="font-size:4rem;"></i>
                    <h4 class="mt-3">Are you sure?</h4>
                    <p class="text-muted">
                        You are about to delete student:<br>
                        <strong class="fs-5">{{ student.name }}</strong>
                        <span class="badge bg-secondary ms-1">ID #{{ student.id }}</span>
                    </p>
                    <div class="d-flex gap-3 justify-content-center mt-4">
                        <form method="POST">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger px-4">
                                <i class="bi bi-trash me-1"></i>Yes, Delete
                            </button>
                        </form>
                        <a href="{% url 'view_students' %}" class="btn btn-outline-secondary px-4">
                            <i class="bi bi-x-circle me-1"></i>Cancel
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
